<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue Coffee AI</title>
  <meta name="description" content="Blue Coffee AI — where ideas brew.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0e1a;
      --surface: #111827;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.3);
      --text: #e2e8f0;
      --text-muted: #94a3b8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated background */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(59, 130, 246, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59, 130, 246, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridMove 20s linear infinite;
    }

    @keyframes gridMove {
      0% { transform: translate(0, 0); }
      100% { transform: translate(60px, 60px); }
    }

    .glow-orb {
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-glow), transparent 70%);
      filter: blur(80px);
      animation: orbFloat 8s ease-in-out infinite;
      pointer-events: none;
    }

    .glow-orb:nth-child(2) {
      top: 60%;
      right: -100px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.2), transparent 70%);
      animation-delay: -4s;
      animation-duration: 10s;
    }

    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, -30px); }
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      max-width: 640px;
    }

    .logo {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      filter: drop-shadow(0 0 20px var(--accent-glow));
      animation: logoIn 1s ease-out;
    }

    @keyframes logoIn {
      from { opacity: 0; transform: scale(0.8) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: fadeUp 1s ease-out 0.2s both;
    }

    .tagline {
      font-size: 1.2rem;
      color: var(--text-muted);
      margin-bottom: 2.5rem;
      animation: fadeUp 1s ease-out 0.4s both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.2rem;
      background: var(--surface);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 999px;
      font-size: 0.9rem;
      color: var(--text-muted);
      animation: fadeUp 1s ease-out 0.6s both;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .footer {
      position: fixed;
      bottom: 2rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow-orb" style="top: -100px; left: -100px;"></div>
  <div class="glow-orb"></div>

  <div class="container">
    <div class="logo">☕</div>
    <h1>Blue Coffee AI</h1>
    <p class="tagline">Where ideas brew.</p>
    <div class="status">
      <span class="status-dot"></span>
      Something is brewing...
    </div>
  </div>

  <div class="footer">© 2026 Blue Coffee AI</div>
</body>
</html>
